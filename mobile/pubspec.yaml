name: dermascan
description: "AI-powered skin disease detection"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  google_fonts: ^6.0.0
  equatable: ^2.0.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.5.4
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  path: ^1.9.0
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model.tflite
    - assets/labels.txt
